services:
  db:
    image: postgres:16-alpine
    container_name: esnaf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: esnaf
      POSTGRES_PASSWORD: esnaf
      POSTGRES_DB: esnaf
    ports:
      - "5432:5432"
    volumes:
      - esnaf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esnaf -d esnaf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  esnaf_pgdata:
